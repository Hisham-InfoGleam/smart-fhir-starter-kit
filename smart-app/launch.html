<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfoGleam Launch (SMART on FHIR)</title>
  <script src="./config.js"></script>
  <script src="./config.local.js" onerror="void 0"></script>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"
          integrity="sha384-dGS6R4ht5hVL6tx4pQCGGEFJV/rS1ywziGTuH/fJeDtWoS4YQJeAaF1qu2/0ZXkk"
          crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }
    .hint { color: #555; max-width: 720px; }
    .problem { color: #a40000; }
    code { background: #f2f2f2; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2 id="title">Launching SMART Context…</h2>
  <p class="hint" id="message">
    This page starts the SMART on FHIR authorization. The EHR or SMART launcher opens it with
    <code>iss</code> (the FHIR server) and, for an EHR launch, <code>launch</code> (the launch context).
  </p>

  <script>
    const cfg = window.INFOGLEAM_CONFIG || {};
    const params = new URLSearchParams(window.location.search);
    const iss = params.get("iss");
    const launch = params.get("launch");

    function showProblem(title, text) {
      document.getElementById("title").textContent = title;
      const p = document.getElementById("message");
      p.textContent = text;
      p.className = "hint problem";
    }

    function buildScope() {
      // A full scope string in config.local.js wins (for example SMART v2 scopes).
      if (typeof cfg.smartScopes === "string" && cfg.smartScopes.trim()) {
        return cfg.smartScopes.trim();
      }

      // EHR launch: the EHR sends a `launch` parameter. The `launch` scope lets
      // the app receive the EHR's context (the patient that is open in the EHR).
      // Standalone launch: no `launch` parameter. `launch/patient` asks the
      // authorization server to let the user pick a patient.
      const scopes = [launch ? "launch" : "launch/patient"];

      // openid + fhirUser: who the signed-in user is.
      if (cfg.includeUserContext !== false) {
        scopes.push("openid", "fhirUser");
      }

      // Read access to the patient's data (SMART v1 syntax).
      // SMART v2 servers use patient/*.rs (read + search) instead.
      scopes.push("patient/*.read");
      return scopes.join(" ");
    }

    if (!window.FHIR) {
      showProblem(
        "Could not load fhirclient",
        "The fhirclient library did not load from the CDN. Check your internet connection and the browser console."
      );
    } else if (!iss) {
      const here = window.location.href.split("?")[0];
      const launcher = cfg.recommendedLauncherUrl || "https://launch.smarthealthit.org/";
      showProblem(
        "No FHIR server given",
        "Open this page from an EHR or a SMART launcher. It needs ?iss=<FHIR server URL>, plus &launch=<id> " +
        "for an EHR launch. For a quick test, open " + launcher + " and use " + here + " as the app launch URL. " +
        "To browse a public FHIR server without SMART, open index.html instead."
      );
    } else {
      FHIR.oauth2.authorize({
        clientId: cfg.smartClientId || "my_web_app",
        scope: buildScope(),
        redirectUri: new URL("index.html", window.location.href).toString()
      }).catch(err => {
        console.error(err);
        showProblem("SMART authorization could not start", err && err.message ? err.message : String(err));
      });
    }
  </script>
</body>
</html>
